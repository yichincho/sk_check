name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Verify packaged release manifest and launcher resources
        run: |
          mkdir -p apk-verification
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print app/build/outputs/apk/release/app-release.apk > apk-verification/manifest.xml
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk > apk-verification/badging.txt
          python scripts/verify_apk_manifest.py apk-verification/manifest.xml apk-verification/badging.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            apk-verification/
            app/build/reports/tests/

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk sk-check.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sk-check-apk
          path: sk-check.apk

      # Keeps the last build's result and log on the build-logs branch, so problems can be read without the Actions page.
      - name: Save build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p /tmp/logs
          cp build.log /tmp/logs/build.log 2>/dev/null || echo "no build log" > /tmp/logs/build.log
          grep -E "^e: |error:|FAILED|What went wrong" -A 3 /tmp/logs/build.log > /tmp/logs/errors.txt || true
          echo "run ${GITHUB_RUN_NUMBER} ${GITHUB_SHA::7} ${RESULT}" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q -b build-logs
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${GITHUB_RUN_NUMBER}: ${RESULT}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs

  launcher-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          name: sk-check-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install release and verify launcher entry
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke_launcher.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-api-${{ matrix.api }}
          path: launcher-*

  publish:
    needs: [build, launcher-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sk-check-apk
      - name: Publish latest release after verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sk-check.apk --target "$GITHUB_SHA" --title "最新版 v0.1.${GITHUB_RUN_NUMBER}" --notes "版本 v0.1.${GITHUB_RUN_NUMBER}，由 ${GITHUB_SHA::7} 自動建置。已通過單元測試、Release APK manifest 檢查及 Android 10/15 模擬器安裝啟動測試；尚未進行小米實機桌面驗證。App 名稱：股票提醒。"
